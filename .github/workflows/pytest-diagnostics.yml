name: Pytest diagnostics

on:
  pull_request:

permissions:
  contents: read

jobs:
  pytest-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --quiet -e ".[dev]"
      - name: Capture pytest output
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pytest -vv 2>&1 | tee pytest-output.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pytest-diagnostics
          path: pytest-output.txt
          retention-days: 3
