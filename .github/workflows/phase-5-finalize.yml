name: Phase 5 finalization

on:
  push:
    branches:
      - agent/phase-5-ga4-research

permissions:
  contents: write

jobs:
  regenerate-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/phase-5-ga4-research
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Regenerate index
        run: python scripts/generate_index.py

      - name: Run pytest diagnostics
        id: pytest
        continue-on-error: true
        run: |
          set -o pipefail
          pytest -vv --tb=long 2>&1 | tee pytest.log

      - name: Run remaining validation
        id: validation
        continue-on-error: true
        run: |
          set -o pipefail
          {
            ruff check .
            mypy scripts
            python scripts/validate_knowledge.py
            python scripts/validate_links.py
            python scripts/validate_markdown_frontmatter.py
            python scripts/generate_index.py --check
          } 2>&1 | tee validation.log

      - name: Commit diagnostics and generated index
        if: always()
        run: |
          mkdir -p diagnostics/phase-5
          cp pytest.log diagnostics/phase-5/pytest.log || true
          cp validation.log diagnostics/phase-5/validation.log || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add INDEX.jsonl diagnostics/phase-5/pytest.log diagnostics/phase-5/validation.log
          if git diff --cached --quiet; then
            echo "No diagnostic or index changes to commit."
          else
            git commit -m "Capture Phase 5 finalization diagnostics"
            git push
          fi

      - name: Fail when checks failed
        if: steps.pytest.outcome == 'failure' || steps.validation.outcome == 'failure'
        run: exit 1
