name: Validate knowledge base

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: pytest

      - name: Run Ruff
        run: ruff check .

      - name: Run mypy
        run: mypy scripts

      - name: Validate canonical knowledge
        run: python scripts/validate_knowledge.py

      - name: Validate links
        run: python scripts/validate_links.py

      - name: Validate Markdown front matter
        run: python scripts/validate_markdown_frontmatter.py

      - name: Check generated index freshness
        run: python scripts/generate_index.py --check
