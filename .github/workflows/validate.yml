name: Validate knowledge base

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          show-progress: false
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -e ".[dev]"

      - name: Run mypy
        id: mypy
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mypy scripts --show-error-codes 2>&1 | tee mypy-output.txt

      - name: Upload mypy diagnostics
        if: steps.mypy.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: mypy-diagnostics
          path: mypy-output.txt
          retention-days: 7

      - name: Fail on mypy errors
        if: steps.mypy.outcome == 'failure'
        run: exit 1

      - name: Run tests
        run: pytest

      - name: Run Ruff
        run: ruff check .

      - name: Validate canonical knowledge
        run: python scripts/validate_knowledge.py

      - name: Validate links
        run: python scripts/validate_links.py

      - name: Validate Markdown front matter
        run: python scripts/validate_markdown_frontmatter.py

      - name: Generate current index
        run: python scripts/generate_index.py

      - name: Commit generated index
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          if git diff --quiet -- INDEX.jsonl; then
            echo "INDEX.jsonl is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add INDEX.jsonl
          git commit -m "Regenerate Phase 7 knowledge index"
          git push origin "HEAD:${{ github.head_ref }}"

      - name: Check generated index freshness
        run: python scripts/generate_index.py --check
