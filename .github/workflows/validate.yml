name: Validate knowledge base

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
          fetch-depth: 0
          show-progress: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -e ".[dev]"

      - name: Run mypy
        id: mypy
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mypy scripts --show-error-codes 2>&1 | tee mypy-output.txt

      - name: Upload mypy diagnostics
        if: steps.mypy.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: mypy-diagnostics
          path: mypy-output.txt
          retention-days: 7

      - name: Fail on mypy errors
        if: steps.mypy.outcome == 'failure'
        run: exit 1

      - name: Regenerate index for Phase 5 branch
        if: github.head_ref == 'agent/phase-5-ga4-research'
        run: python scripts/generate_index.py

      - name: Run tests
        run: pytest

      - name: Run Ruff
        run: ruff check .

      - name: Validate canonical knowledge
        run: python scripts/validate_knowledge.py

      - name: Validate links
        run: python scripts/validate_links.py

      - name: Validate Markdown front matter
        run: python scripts/validate_markdown_frontmatter.py

      - name: Check generated index freshness
        run: python scripts/generate_index.py --check

      - name: Commit regenerated index
        if: github.head_ref == 'agent/phase-5-ga4-research'
        run: |
          if git diff --quiet -- INDEX.jsonl; then
            echo "INDEX.jsonl is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add INDEX.jsonl
          git commit -m "Regenerate index for Phase 5 GA4"
          git push origin HEAD:agent/phase-5-ga4-research
