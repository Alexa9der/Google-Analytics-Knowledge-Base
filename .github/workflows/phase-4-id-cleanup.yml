name: Phase 4 ID cleanup diagnostics

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run pytest with full diagnostics
        id: pytest
        continue-on-error: true
        run: |
          set -o pipefail
          pytest -vv --tb=long 2>&1 | tee pytest.log

      - name: Regenerate index
        run: python scripts/generate_index.py

      - name: Run remaining validation
        id: validation
        continue-on-error: true
        run: |
          set -o pipefail
          {
            ruff check .
            mypy scripts
            python scripts/validate_knowledge.py
            python scripts/validate_links.py
            python scripts/validate_markdown_frontmatter.py
            python scripts/generate_index.py --check
          } 2>&1 | tee validation.log

      - name: Package diagnostics
        if: always()
        run: |
          mkdir -p diagnostics
          cp pytest.log diagnostics/pytest.log || true
          cp validation.log diagnostics/validation.log || true
          cp INDEX.jsonl diagnostics/INDEX.jsonl

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-4-id-cleanup-diagnostics
          path: diagnostics
          if-no-files-found: error

      - name: Fail when checks failed
        if: steps.pytest.outcome == 'failure' || steps.validation.outcome == 'failure'
        run: exit 1
