  - {id: "FACT-01KXCN00000000000000000001", title: "Search impression definition", statement: "A Search Console impression is counted when a user sees, or potentially sees, a link to the property in the applicable Google surface under that result type's visibility rules.", type: "definition_claim", subject: "Search Console impression", predicate: "counts", object: "eligible presentation of a property link", scope: {channel: "UI", verified_on: "2026-07-12"}, status: "confirmed", confidence: "high", evidence_ids: ["EVID-01KXCN00000000000000000001"], concept_ids: ["CONCEPT-01KXCN00000000000000000001", "CONCEPT-01KXB0H9ZM2J36209PV7RXPCD3"], service_ids: ["SERVICE-01KXB0H9ZMVPFDX90GE5ZQZWQQ"], owner: "google-analytics-knowledge-project", created_at: "2026-07-12", last_verified_at: "2026-07-12"}
  - {id: "FACT-01KXCN00000000000000000002", title: "Search click definition", statement: "A Search Console click is counted when a user clicks a Google result link that takes the user outside Google to the property.", type: "definition_claim", subject: "Search Console click", predicate: "counts", object: "outbound result-link activation", scope: {channel: "UI", verified_on: "2026-07-12"}, status: "confirmed", confidence: "high", evidence_ids: ["EVID-01KXCN00000000000000000001"], concept_ids: ["CONCEPT-01KXCN00000000000000000002", "CONCEPT-01KXB0H9ZM2J36209PV7RXPCD3"], service_ids: ["SERVICE-01KXB0H9ZMVPFDX90GE5ZQZWQQ"], owner: "google-analytics-knowledge-project", created_at: "2026-07-12", last_verified_at: "2026-07-12"}
