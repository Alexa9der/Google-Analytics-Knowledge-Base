schema_version: "1.0"
entity_type: "concept"
domain: "analytics"
topic: "analytics-core"
owner: "google-analytics-knowledge-project"
records:
  - id: "CONCEPT-01KXB0H9ZM2J36209PV7RXPCD3"
    preferred_label: "Metric"
    definition: "A quantitative value used to describe or assess an observed subject or process."
    boundaries: "A metric is the measured value, not the descriptive attribute used to group it."
    status: "proposal"
    owner: "google-analytics-knowledge-project"
    created_at: "2026-07-12"
    last_reviewed_at: "2026-07-12"
  - id: "CONCEPT-01KXB0H9ZMB53TZPK3Q8N6XDVB"
    preferred_label: "Dimension"
    definition: "A qualitative attribute used to describe, categorize, or segment observations."
    boundaries: "A dimension provides descriptive context rather than a quantitative measurement."
    status: "proposal"
    owner: "google-analytics-knowledge-project"
    created_at: "2026-07-12"
    last_reviewed_at: "2026-07-12"
  - id: "CONCEPT-01KXB0H9ZMY0Z31MBFPCDF5Y3Q"
    preferred_label: "Event"
    definition: "A recorded occurrence associated with a time and a defined subject or context."
    boundaries: "An event is an occurrence record, not a person, device, or aggregate metric."
    status: "proposal"
    owner: "google-analytics-knowledge-project"
    created_at: "2026-07-12"
    last_reviewed_at: "2026-07-12"
  - id: "CONCEPT-01KXB0H9ZMX4S975N077EGM94N"
    preferred_label: "User"
    definition: "An identified or represented actor that interacts with a system or property."
    boundaries: "A user representation may not correspond one-to-one with a natural person."
    status: "proposal"
    owner: "google-analytics-knowledge-project"
    created_at: "2026-07-12"
    last_reviewed_at: "2026-07-12"
  - id: "CONCEPT-01KXB0H9ZM410EY10Q7A190K5X"
    preferred_label: "Device"
    definition: "A physical or virtual endpoint through which interactions are performed or observed."
    boundaries: "A device is distinct from the person, account, or session associated with it."
    status: "proposal"
    owner: "google-analytics-knowledge-project"
    created_at: "2026-07-12"
    last_reviewed_at: "2026-07-12"
  - id: "CONCEPT-01KXB0H9ZMXAWK23YMRYR5Q133"
    preferred_label: "Session"
    definition: "A bounded grouping of related interactions under an explicit continuity rule."
    boundaries: "Session boundaries depend on the governing rule and are not universally fixed."
    status: "proposal"
    owner: "google-analytics-knowledge-project"
    created_at: "2026-07-12"
    last_reviewed_at: "2026-07-12"
  - id: "CONCEPT-01KXB0H9ZMR0V5MR51TCWN4AAP"
    preferred_label: "Visitor"
    definition: "A represented visitor to a digital property during one or more interactions."
    boundaries: "A visitor representation is not necessarily a verified person or persistent user."
    status: "proposal"
    owner: "google-analytics-knowledge-project"
    created_at: "2026-07-12"
    last_reviewed_at: "2026-07-12"
  - id: "CONCEPT-01KXB0H9ZM80395EP8SM7W6T0Z"
    preferred_label: "Acquisition"
    definition: "The process by which a user, visitor, or customer first reaches or adopts an offering."
    boundaries: "Acquisition describes entry or adoption, not all later engagement or retention."
    status: "proposal"
    owner: "google-analytics-knowledge-project"
    created_at: "2026-07-12"
    last_reviewed_at: "2026-07-12"
  - id: "CONCEPT-01KXB0H9ZMBPTYGA7SHR0K94VE"
    preferred_label: "Install"
    definition: "The placement of a software application on a device or execution environment."
    boundaries: "An install is distinct from first use, activation, account creation, or purchase."
    status: "proposal"
    owner: "google-analytics-knowledge-project"
    created_at: "2026-07-12"
    last_reviewed_at: "2026-07-12"
  - id: "CONCEPT-01KXB0H9ZMYRQ1M9SS0TJR22Z6"
    preferred_label: "First open"
    definition: "The first observed opening of an application within a defined identity and measurement scope."
    boundaries: "First open is an observation under a scope, not proof of a first-ever human use."
    status: "proposal"
    owner: "google-analytics-knowledge-project"
    created_at: "2026-07-12"
    last_reviewed_at: "2026-07-12"
  - id: "CONCEPT-01KXB0H9ZM7K68XC5GGFPJZPEQ"
    preferred_label: "Conversion"
    definition: "An interaction or outcome designated as satisfying a defined objective."
    boundaries: "Conversion depends on an explicit objective and does not imply revenue."
    status: "proposal"
    owner: "google-analytics-knowledge-project"
    created_at: "2026-07-12"
    last_reviewed_at: "2026-07-12"
  - id: "CONCEPT-01KXB0H9ZMPHJCZMXVQTC5AMX0"
    preferred_label: "Revenue"
    definition: "A monetary amount recognized as income within a defined accounting or measurement scope."
    boundaries: "Revenue is not equivalent to profit, cash received, or transaction count."
    status: "proposal"
    owner: "google-analytics-knowledge-project"
    created_at: "2026-07-12"
    last_reviewed_at: "2026-07-12"
  - id: "CONCEPT-01KXB0H9ZM8Q0EGP8QRMF2CAD7"
    preferred_label: "Purchase"
    definition: "A transaction in which value is exchanged to obtain a product, service, or right."
    boundaries: "A purchase is distinct from an intent, cart action, refund, or subscription renewal."
    status: "proposal"
    owner: "google-analytics-knowledge-project"
    created_at: "2026-07-12"
    last_reviewed_at: "2026-07-12"
  - id: "CONCEPT-01KXB0H9ZM40HGECRYWM7VSPCM"
    preferred_label: "Subscription"
    definition: "An arrangement granting continuing access or benefits under recurring or term-based conditions."
    boundaries: "A subscription is the arrangement, not each payment, renewal, or usage event."
    status: "proposal"
    owner: "google-analytics-knowledge-project"
    created_at: "2026-07-12"
    last_reviewed_at: "2026-07-12"
  - id: "CONCEPT-01KXB0H9ZMH409C8HS5KKTPH98"
    preferred_label: "Advertising revenue"
    definition: "Revenue attributed to the delivery, display, engagement, or sale of advertising."
    boundaries: "It excludes non-advertising income unless explicitly combined in a broader measure."
    status: "proposal"
    owner: "google-analytics-knowledge-project"
    created_at: "2026-07-12"
    last_reviewed_at: "2026-07-12"
  - id: "CONCEPT-01KXB0H9ZMXPT1ZMXS689KRCTK"
    preferred_label: "Data export"
    definition: "The transfer or production of data from a source system into an external representation or destination."
    boundaries: "An export does not itself guarantee completeness, synchronization, or downstream usability."
    status: "proposal"
    owner: "google-analytics-knowledge-project"
    created_at: "2026-07-12"
    last_reviewed_at: "2026-07-12"
  - id: "CONCEPT-01KXB0H9ZMQ30G90BCGR86CB87"
    preferred_label: "Attribution"
    definition: "The assignment of credit for an outcome among contributing interactions or factors."
    boundaries: "Attribution reflects a defined method and is not direct proof of causation."
    status: "proposal"
    owner: "google-analytics-knowledge-project"
    created_at: "2026-07-12"
    last_reviewed_at: "2026-07-12"
  - id: "CONCEPT-01KXB0H9ZMBYM231E33WXJADZ4"
    preferred_label: "Data retention"
    definition: "The policy and practice governing how long data remains stored or available."
    boundaries: "Retention is distinct from backup duration, legal preservation, and data freshness."
    status: "proposal"
    owner: "google-analytics-knowledge-project"
    created_at: "2026-07-12"
    last_reviewed_at: "2026-07-12"
  - id: "CONCEPT-01KXB0H9ZMG7GCKKQ7WE2SHH6Z"
    preferred_label: "Consent"
    definition: "A recorded indication that a subject agrees to a specified action under stated conditions."
    boundaries: "Consent is purpose- and context-specific and is distinct from other legal bases."
    status: "proposal"
    owner: "google-analytics-knowledge-project"
    created_at: "2026-07-12"
    last_reviewed_at: "2026-07-12"
  - id: "CONCEPT-01KXB0H9ZM4TWWPJV2A4NKBSTS"
    preferred_label: "Privacy thresholding"
    definition: "The suppression or alteration of outputs when privacy-related release conditions are not met."
    boundaries: "Thresholding affects disclosed outputs and is distinct from source-data deletion or retention."
    status: "proposal"
    owner: "google-analytics-knowledge-project"
    created_at: "2026-07-12"
    last_reviewed_at: "2026-07-12"
  - id: "CONCEPT-01KXCH0000PN2PFDFBRFASGKGP"
    preferred_label: "Rating"
    definition: "A value selected from an ordered scale to express an assessment of a subject."
    boundaries: "A rating is a scale value, not the accompanying written explanation, an aggregate average, or a distribution."
    status: "reviewed"
    owner: "google-analytics-knowledge-project"
    created_at: "2026-07-12"
    last_reviewed_at: "2026-07-12"
    related_concept_ids: ["CONCEPT-01KXCH00002HTN7PET65GS7FZM", "CONCEPT-01KXCH0000AKE3D1RV9RXAAKXW"]
  - id: "CONCEPT-01KXCH00002HTN7PET65GS7FZM"
    preferred_label: "Review"
    definition: "A written assessment submitted about a subject, often accompanied by a rating."
    boundaries: "A review requires written content and is distinct from rating-only feedback or a developer response."
    status: "reviewed"
    owner: "google-analytics-knowledge-project"
    created_at: "2026-07-12"
    last_reviewed_at: "2026-07-12"
    related_concept_ids: ["CONCEPT-01KXCH0000PN2PFDFBRFASGKGP", "CONCEPT-01KXCH0000PY0R0VTX3T5Z5SK7", "CONCEPT-01KXCH0000YDZ4DAN41FZ1NFCM"]
  - id: "CONCEPT-01KXCH0000PY0R0VTX3T5Z5SK7"
    preferred_label: "Feedback"
    definition: "Information supplied in response to an experience, product, or process for assessment or improvement."
    boundaries: "Feedback can be public or private and does not necessarily contain a rating or constitute a review."
    status: "reviewed"
    owner: "google-analytics-knowledge-project"
    created_at: "2026-07-12"
    last_reviewed_at: "2026-07-12"
    related_concept_ids: ["CONCEPT-01KXCH00002HTN7PET65GS7FZM"]
  - id: "CONCEPT-01KXCH0000YDZ4DAN41FZ1NFCM"
    preferred_label: "Developer response"
    definition: "A response published by a product or service provider to submitted feedback or a review."
    boundaries: "A developer response is authored by the provider and does not replace or alter the submitter's rating or review."
    status: "reviewed"
    owner: "google-analytics-knowledge-project"
    created_at: "2026-07-12"
    last_reviewed_at: "2026-07-12"
    related_concept_ids: ["CONCEPT-01KXCH00002HTN7PET65GS7FZM"]
  - id: "CONCEPT-01KXCH0000AKE3D1RV9RXAAKXW"
    preferred_label: "Rating distribution"
    definition: "A frequency or proportion breakdown of observations across the values of a rating scale."
    boundaries: "A distribution preserves scale-value composition and is distinct from an average rating or a single rating."
    status: "reviewed"
    owner: "google-analytics-knowledge-project"
    created_at: "2026-07-12"
    last_reviewed_at: "2026-07-12"
    related_concept_ids: ["CONCEPT-01KXCH0000PN2PFDFBRFASGKGP", "CONCEPT-01KXB0H9ZM2J36209PV7RXPCD3"]
  - id: "CONCEPT-01KXCJ00008ZXK47F56XZ1CEDH"
    preferred_label: "Crash"
    definition: "An abnormal termination of a running software process caused by an unrecoverable failure."
    boundaries: "A crash terminates execution and is distinct from an unresponsive but still-running process."
    status: "reviewed"
    owner: "google-analytics-knowledge-project"
    created_at: "2026-07-12"
    last_reviewed_at: "2026-07-12"
  - id: "CONCEPT-01KXCJ0000JM9GY1DBQTT3MP39"
    preferred_label: "Application not responding"
    definition: "A condition where an application remains running but fails to respond within a defined time limit."
    boundaries: "An ANR is an unresponsiveness condition, not an application-process termination."
    status: "reviewed"
    owner: "google-analytics-knowledge-project"
    created_at: "2026-07-12"
    last_reviewed_at: "2026-07-12"
  - id: "CONCEPT-01KXCJ0000KEH4JX1R4FZYM258"
    preferred_label: "Rendering performance"
    definition: "The timing and throughput characteristics of producing visual frames for display."
    boundaries: "Rendering performance concerns frame production and is distinct from application startup duration."
    status: "reviewed"
    owner: "google-analytics-knowledge-project"
    created_at: "2026-07-12"
    last_reviewed_at: "2026-07-12"
  - id: "CONCEPT-01KXCJ0000KSD4RT927QDMGA11"
    preferred_label: "Startup performance"
    definition: "The timing characteristics of moving an application from a launch request to a defined readiness milestone."
    boundaries: "Startup performance requires an explicit endpoint and does not describe ongoing frame rendering."
    status: "reviewed"
    owner: "google-analytics-knowledge-project"
    created_at: "2026-07-12"
    last_reviewed_at: "2026-07-12"
  - id: "CONCEPT-01KXCJ0000JBFBH400BJGFBTSY"
    preferred_label: "Battery usage"
    definition: "Consumption or retention of device energy attributable to software activity within a defined measurement scope."
    boundaries: "Battery usage is distinct from a single wake-up, wake lock, network transfer, or elapsed session duration."
    status: "reviewed"
    owner: "google-analytics-knowledge-project"
    created_at: "2026-07-12"
    last_reviewed_at: "2026-07-12"
  - id: "CONCEPT-01KXCJ0000JMSB9NV5HPDMVRVH"
    preferred_label: "Performance metric"
    definition: "A quantitative measure of the speed, responsiveness, efficiency, or resource behavior of a system."
    boundaries: "A performance metric measures behavior and is distinct from a threshold or qualitative recommendation."
    status: "reviewed"
    owner: "google-analytics-knowledge-project"
    created_at: "2026-07-12"
    last_reviewed_at: "2026-07-12"
    broader_concept_ids: ["CONCEPT-01KXB0H9ZM2J36209PV7RXPCD3"]
  - id: "CONCEPT-01KXCJ0000B5CS7C0SQTSBNN67"
    preferred_label: "Quality signal"
    definition: "An observed measure or condition used as evidence when assessing quality."
    boundaries: "A quality signal informs assessment but is not itself a complete quality judgment or enforcement action."
    status: "reviewed"
    owner: "google-analytics-knowledge-project"
    created_at: "2026-07-12"
    last_reviewed_at: "2026-07-12"
  - id: "CONCEPT-01KXCN00000000000000000001"
    preferred_label: "Search impression"
    definition: "A counted presentation of a search result or search-linked content under the visibility rules of a search surface."
    boundaries: "A search impression records eligible presentation, not a visit, click, person, or conversion."
    status: "reviewed"
    owner: "google-analytics-knowledge-project"
    created_at: "2026-07-12"
    last_reviewed_at: "2026-07-12"
    broader_concept_ids: ["CONCEPT-01KXB0H9ZM2J36209PV7RXPCD3"]
  - id: "CONCEPT-01KXCN00000000000000000002"
    preferred_label: "Search click"
    definition: "A counted activation of a search result link that takes the searcher outside the search surface."
    boundaries: "A search click is an interaction count, not proof of a loaded page, session, unique user, or conversion."
    status: "reviewed"
    owner: "google-analytics-knowledge-project"
    created_at: "2026-07-12"
    last_reviewed_at: "2026-07-12"
  - id: "CONCEPT-01KXCN00000000000000000003"
    preferred_label: "Search query"
    definition: "The expression submitted to a search system for retrieving or presenting results."
    boundaries: "A search query describes the request, not the result page, destination page, searcher, or intent with certainty."
    status: "reviewed"
    owner: "google-analytics-knowledge-project"
    created_at: "2026-07-12"
    last_reviewed_at: "2026-07-12"
    broader_concept_ids: ["CONCEPT-01KXB0H9ZMB53TZPK3Q8N6XDVB"]
  - id: "CONCEPT-01KXCN00000000000000000004"
    preferred_label: "Search result position"
    definition: "An ordinal placement assigned to an eligible item within a search-results presentation."
    boundaries: "Position is relative to a defined results layout and counting method; it is not a traffic or conversion outcome."
    status: "reviewed"
    owner: "google-analytics-knowledge-project"
    created_at: "2026-07-12"
    last_reviewed_at: "2026-07-12"
    broader_concept_ids: ["CONCEPT-01KXB0H9ZM2J36209PV7RXPCD3"]
  - id: "CONCEPT-01KXCN00000000000000000005"
    preferred_label: "Click-through rate"
    definition: "The ratio of counted clicks to counted impressions for the same measurement scope."
    boundaries: "Click-through rate requires compatible click and impression populations and does not measure post-click behavior."
    status: "reviewed"
    owner: "google-analytics-knowledge-project"
    created_at: "2026-07-12"
    last_reviewed_at: "2026-07-12"
    synonyms: ["CTR"]
    broader_concept_ids: ["CONCEPT-01KXB0H9ZM2J36209PV7RXPCD3"]
  - id: "CONCEPT-01KXCN00000000000000000006"
    preferred_label: "Search appearance"
    definition: "A classification of the visual or functional result treatment through which content appears on a search surface."
    boundaries: "Search appearance is a presentation classification, not a query, page, device, or search type."
    status: "reviewed"
    owner: "google-analytics-knowledge-project"
    created_at: "2026-07-12"
    last_reviewed_at: "2026-07-12"
    broader_concept_ids: ["CONCEPT-01KXB0H9ZMB53TZPK3Q8N6XDVB"]
  - id: "CONCEPT-01KXCN00000000000000000007"
    preferred_label: "Search type"
    definition: "A classification of the search surface or content mode within which search performance is measured."
    boundaries: "Search type selects a measurement population and is distinct from result appearance or device category."
    status: "reviewed"
    owner: "google-analytics-knowledge-project"
    created_at: "2026-07-12"
    last_reviewed_at: "2026-07-12"
    broader_concept_ids: ["CONCEPT-01KXB0H9ZMB53TZPK3Q8N6XDVB"]
  - id: "CONCEPT-01KXCN00000000000000000008"
    preferred_label: "Canonical URL"
    definition: "The representative URL selected for a set of duplicate or substantially similar resource URLs."
    boundaries: "A canonical URL is an aggregation and indexing representative; it need not be the literal URL a visitor ultimately loads."
    status: "reviewed"
    owner: "google-analytics-knowledge-project"
    created_at: "2026-07-12"
    last_reviewed_at: "2026-07-12"
  - id: "CONCEPT-01KXCN00000000000000000009"
    preferred_label: "Anonymized query"
    definition: "A search query whose literal value is withheld from row-level reporting to protect searcher privacy."
    boundaries: "Withholding the query text does not necessarily remove its contribution from every aggregate total."
    status: "reviewed"
    owner: "google-analytics-knowledge-project"
    created_at: "2026-07-12"
    last_reviewed_at: "2026-07-12"
    broader_concept_ids: ["CONCEPT-01KXCN00000000000000000003", "CONCEPT-01KXB0H9ZM4TWWPJV2A4NKBSTS"]
