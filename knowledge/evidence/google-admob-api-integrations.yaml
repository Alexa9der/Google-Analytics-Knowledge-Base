    source_location: "https://support.google.com/admob/answer/16585829?hl=en#retention"
    retrieved_at: "2026-07-12"
    summary: "Official AdMob Help lists report data-retention windows, including 90 days for User Activity and 2,555 days for Ads Activity, Cohort, and Privacy & messaging reports, and confirms CSV and API retrieval channels."
    authority: "primary_authoritative"
    directness: "direct"
    status: "verified"
    last_verified_at: "2026-07-12"

