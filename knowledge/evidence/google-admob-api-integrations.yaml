    source_location: "https://support.google.com/admob/answer/9263723?hl=en#user_metrics"
    retrieved_at: "2026-07-12"
    summary: "Official AdMob Help explains that linking an AdMob app to Firebase and integrating the Google Analytics for Firebase SDK enables user metrics including sessions, session duration, ad exposure per session, and active users."
    authority: "primary_authoritative"
    directness: "direct"
    status: "verified"
    last_verified_at: "2026-07-12"

  - id: "EVID-01KXBVE317Q439T05ZESFGF7JR"
    source_location: "https://support.google.com/admob/answer/6128738?hl=en#about_ad_units"
    retrieved_at: "2026-07-12"
    summary: "Official AdMob Help defines an ad unit as a container placed in an app that sends ad requests and displays returned ads, and lists supported formats including banner, interstitial, rewarded, rewarded interstitial, native, and app open."
    authority: "primary_authoritative"
    directness: "direct"
    status: "verified"
    last_verified_at: "2026-07-12"

  - id: "EVID-01KXBVE317XQ6W0Z9SWF2FRB5N"
    source_location: "https://support.google.com/admob/answer/11322405?hl=en#paid_event_handler"
    retrieved_at: "2026-07-12"
    summary: "Official AdMob Help documents impression-level ad revenue callbacks, USD revenue values, precision levels, and the SDK paid-event handler used to receive revenue information when an impression occurs."
    authority: "primary_authoritative"
    directness: "direct"
    status: "verified"
    last_verified_at: "2026-07-12"

  - id: "EVID-01KXBVE317BH9F6ZA4FMSJH21D"
    source_location: "https://support.google.com/admob/answer/11322405?hl=en#firebase"
    retrieved_at: "2026-07-12"
    summary: "Official AdMob Help states that impression-level ad revenue can be sent to Google Analytics for Firebase when the AdMob app is linked to Firebase and the required SDK integration is present."
    authority: "primary_authoritative"
    directness: "direct"
    status: "verified"
    last_verified_at: "2026-07-12"

  - id: "EVID-01KXBVE31863MJYJXKNR7NEYT1"
    source_location: "https://support.google.com/admob/table/9462111?hl=en#estimated_earnings"
    retrieved_at: "2026-07-12"
    summary: "Official AdMob reports glossary defines estimated earnings and states that the value can change before payment because of adjustments."
    authority: "primary_authoritative"
    directness: "direct"
    status: "verified"
    last_verified_at: "2026-07-12"

  - id: "EVID-01KXBVE318F0N3NNZP73YXVQ72"
    source_location: "https://support.google.com/admob/answer/13291097?hl=en#freshness"
    retrieved_at: "2026-07-12"
    summary: "Official AdMob Help documents that reporting data is not instantaneous, gives approximate latency for AdMob and mediation sources, and warns that recent values can change after invalid-traffic and other adjustments."
    authority: "primary_authoritative"
    directness: "direct"
    status: "verified"
    last_verified_at: "2026-07-12"

