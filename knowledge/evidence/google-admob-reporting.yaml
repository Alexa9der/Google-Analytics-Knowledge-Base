  - id: "EVID-01KXBTRX58TCTDT9CSNVGQ8SVB"
    source_location: "https://developers.google.com/admob/api/v1/report-metrics-dimensions#dimension"
    retrieved_at: "2026-07-12"
    summary: "Official AdMob API reference defines report dimensions as attributes that break down metrics and lists time, inventory, geography, format, platform, app-version, SDK-version, and operating-system dimensions with compatibility notes."
    excerpt: "Dimensions are data attributes to breakdown or refine the quantitative measurements by certain attributes."
    authority: "primary_authoritative"
    directness: "direct"
    status: "verified"
    last_verified_at: "2026-07-12"

  - id: "EVID-01KXBTRX585YZ1RWP31DR7MZ5J"
    source_location: "https://developers.google.com/admob/api/v1/report-metrics-dimensions#metric"
    retrieved_at: "2026-07-12"
    summary: "Official AdMob API metric table defines ad requests, matched requests, impressions, clicks, estimated earnings, impression CTR, impression RPM, match rate, show rate, and observed eCPM."
    excerpt: "Metrics are quantitative measurements indicating how the publisher business is performing."
    authority: "primary_authoritative"
    directness: "direct"
    status: "verified"
    last_verified_at: "2026-07-12"

  - id: "EVID-01KXBTRX58GVR7MM4KPGKGAT1B"
    source_location: "https://developers.google.com/admob/api/v1/report-overview#reports"
    retrieved_at: "2026-07-12"
    summary: "Official reporting overview distinguishes network reports for AdMob performance from mediation reports that include third-party performance."
    excerpt: "The AdMob API has the ability to generate network and mediation reports."
    authority: "primary_authoritative"
    directness: "direct"
    status: "verified"
    last_verified_at: "2026-07-12"

  - id: "EVID-01KXBTRX58HQEWM0JGQQYD4JB3"
    source_location: "https://developers.google.com/admob/api/v1/report-overview#dimensions"
    retrieved_at: "2026-07-12"
    summary: "Official reporting overview states that dimensions group report data, omission of dimensions produces one account-level row, metrics are required, and filters restrict rows through dimensions."
    excerpt: "If no dimensions are specified, the report returns a single row of the requested metrics for the entire account."
    authority: "primary_authoritative"
    directness: "direct"
    status: "verified"
    last_verified_at: "2026-07-12"

  - id: "EVID-01KXBTRX586XH4G3FRTG5YRSR1"
    source_location: "https://developers.google.com/admob/api/v1/report-overview#reduce_report_limits"
    retrieved_at: "2026-07-12"
    summary: "Official reporting overview documents a 100,000-row report limit, truncation behavior, and recommended reductions in date range or dimensions."
    excerpt: "When a report with over 100,000 rows is requested, the report will be truncated and the first 100,000 rows will be returned."
    authority: "primary_authoritative"
    directness: "direct"
    status: "verified"
    last_verified_at: "2026-07-12"

  - id: "EVID-01KXBTRX58MY1F0FR1VWWTYRM5"
    source_location: "https://developers.google.com/admob/api/v1/reporting#make_a_request"
    retrieved_at: "2026-07-12"
    summary: "Official AdMob API guide documents OAuth 2.0 prerequisites and separates the readonly scope from the report scope, including their data boundaries."
    excerpt: "The admob.report scope can see ad performance and earnings reports, publisher ID, timezone, and default currency code."
    authority: "primary_authoritative"
    directness: "direct"
    status: "verified"
    last_verified_at: "2026-07-12"

  - id: "EVID-01KXBTRX58Q6816KR0JFC0DCS2"
    source_location: "https://developers.google.com/admob/api/reference/rest/v1/accounts.networkReport/generate"
    retrieved_at: "2026-07-12"
    summary: "Official REST reference defines the networkReport.generate POST method, report specification input, server-side streaming response, header-row-footer structure, account resource name, and accepted OAuth scopes."
    excerpt: "The first response contains the report header, then a stream of row responses, and finally a footer."
    authority: "primary_authoritative"
    directness: "direct"
    status: "verified"
    last_verified_at: "2026-07-12"

  - id: "EVID-01KXBTRX58AYXF33YXGTWSNQZ4"
    source_location: "https://developers.google.com/admob/api/quotas#quota_limits"
    retrieved_at: "2026-07-12"
    summary: "Official AdMob API quota page lists separate account, inventory, and reporting quotas and documents 900 reporting read requests per minute per project."
    excerpt: "Reporting read requests per minute per project: 900."
    authority: "primary_authoritative"
    directness: "direct"
    status: "verified"
