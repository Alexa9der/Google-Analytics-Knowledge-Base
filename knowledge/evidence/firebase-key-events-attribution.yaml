records:
  - id: "EVID-01KXD7V90MQXQJ3X7HV0EF4XV7"
    source_location: "https://support.google.com/analytics/answer/9267568?hl=en#what_is_a_key_event"
    retrieved_at: "2026-07-12"
    summary: "Official Analytics Help defines a key event as an event measuring an action particularly important to the business and states that any collected event can be marked as a key event."
    authority: "primary_authoritative"
    directness: "direct"
    status: "verified"
    last_verified_at: "2026-07-12"

  - id: "EVID-01KXD7V90MJJKV2W8GDB1KMT7F"
    source_location: "https://support.google.com/analytics/answer/13128484?hl=en#limits"
    retrieved_at: "2026-07-12"
    summary: "Official Analytics Help states that standard properties can mark up to 30 events as key events and Analytics 360 properties up to 50."
    authority: "primary_authoritative"
    directness: "direct"
    status: "verified"
    last_verified_at: "2026-07-12"

  - id: "EVID-01KXD7V90M5H8Z1122E68XR8ME"
    source_location: "https://support.google.com/analytics/answer/13128484?hl=en#default_key_events"
    retrieved_at: "2026-07-12"
    summary: "Official Analytics Help lists purchase, first_open, in_app_purchase, app_store_subscription_convert, and app_store_subscription_renew as events marked as key events by default for applicable app streams."
    authority: "primary_authoritative"
    directness: "direct"
    status: "verified"
    last_verified_at: "2026-07-12"

  - id: "EVID-01KXD7V90MS3WRB5ERE9ZRNJYB"
    source_location: "https://support.google.com/analytics/answer/13128484?hl=en#results"
    retrieved_at: "2026-07-12"
    summary: "Official Analytics Help states that marking an event as a key event affects reporting prospectively, does not change historical data, and can take up to 24 hours to appear in standard reports."
    authority: "primary_authoritative"
    directness: "direct"
    status: "verified"
    last_verified_at: "2026-07-12"

  - id: "EVID-01KXD7V90MS1TQJ7A7MFWP7GBX"
    source_location: "https://support.google.com/analytics/answer/9267568?hl=en#report_on_key_events"
    retrieved_at: "2026-07-12"
    summary: "Official Analytics Help states that key-event reports and explorations can count triggers and attribute credit to touchpoints on a user's path."
    authority: "primary_authoritative"
    directness: "direct"
    status: "verified"
    last_verified_at: "2026-07-12"

  - id: "EVID-01KXD7V90MQ20YDPGWMV7CGAWF"
    source_location: "https://support.google.com/analytics/answer/11242841?hl=en#collection"
    retrieved_at: "2026-07-12"
    summary: "Official Analytics Help documents campaign source, medium, name, content, term, and ID collection fields and states that SDKs or tracking code send those values to Analytics."
    authority: "primary_authoritative"
    directness: "direct"
    status: "verified"
    last_verified_at: "2026-07-12"

  - id: "EVID-01KXD7V90NNZCV0DHNHH4S7JKE"
    source_location: "https://support.google.com/analytics/answer/11242841?hl=en#session_behavior"
    retrieved_at: "2026-07-12"
    summary: "Official Analytics Help states that each session is associated with one campaign or traffic source and that a new source encountered mid-session does not start a new session."
    authority: "primary_authoritative"
    directness: "direct"
    status: "verified"
    last_verified_at: "2026-07-12"

  - id: "EVID-01KXD7V90NTEPZ05X30HZK2037"
    source_location: "https://support.google.com/analytics/answer/11242841?hl=en#reporting"
    retrieved_at: "2026-07-12"
    summary: "Official Analytics Help distinguishes user-, session-, and event-scoped source, medium, and campaign dimensions in reports and APIs."
    authority: "primary_authoritative"
    directness: "direct"
    status: "verified"
    last_verified_at: "2026-07-12"

  - id: "EVID-01KXD7V90N6MC90KPVH7RYS4XZ"
    source_location: "https://support.google.com/analytics/answer/11242841?hl=en#attribution"
    retrieved_at: "2026-07-12"
    summary: "Official Analytics Help defines attribution as assigning credit for key events to ads, clicks, and factors along the user's path and documents the campaign key-event lookback window."
    authority: "primary_authoritative"
    directness: "direct"
    status: "verified"
    last_verified_at: "2026-07-12"
